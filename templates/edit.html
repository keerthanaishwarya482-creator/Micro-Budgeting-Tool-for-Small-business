<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction | Micro Budgeting</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f5fb;
            color: #29252f;
        }

        /* Navigation */

        .navbar {
            background: white;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #6a1b9a;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: #555;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #6a1b9a;
        }

        /* Main */

        .container {
            width: 90%;
            max-width: 700px;
            margin: 45px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #777;
        }

        /* Form */

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6a1b9a;
            box-shadow: 0 0 0 3px #f3e5f5;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .cancel {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #6a1b9a;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #4a148c;
        }

        .cancel {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .cancel:hover {
            background: #e9d7ed;
        }

        /* Responsive */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links a {
                margin-left: 8px;
            }

            .container {
                width: 95%;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            Micro Budgeting
        </div>

        <div class="nav-links">

            <a href="/">
                Dashboard
            </a>

            <a href="/transactions">
                Transactions
            </a>

            <a href="/add">
                Add Transaction
            </a>

        </div>

    </nav>


    <!-- Main -->

    <main class="container">


        <div class="heading">

            <h1>
                Edit Transaction
            </h1>

            <p>
                Update your transaction details
            </p>

        </div>


        <div class="form-card">


            <form method="POST">


                <!-- Transaction Type -->

                <div class="form-group">

                    <label for="transaction_type">
                        Transaction Type
                    </label>

                    <select
                        id="transaction_type"
                        name="transaction_type"
                        required
                    >

                        <option
                            value="Income"
                            {% if transaction.transaction_type == "Income" %}
                            selected
                            {% endif %}
                        >
                            Income
                        </option>

                        <option
                            value="Expense"
                            {% if transaction.transaction_type == "Expense" %}
                            selected
                            {% endif %}
                        >
                            Expense
                        </option>

                    </select>

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        id="amount"
                        type="number"
                        name="amount"
                        step="0.01"
                        min="0"
                        value="{{ transaction.amount }}"
                        required
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        id="category"
                        type="text"
                        name="category"
                        value="{{ transaction.category }}"
                        required
                    >

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="transaction_date">
                        Date
                    </label>

                    <input
                        id="transaction_date"
                        type="date"
                        name="transaction_date"
                        value="{{ transaction.transaction_date }}"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        id="description"
                        type="text"
                        name="description"
                        value="{{ transaction.description }}"
                        placeholder="Enter description"
                    >

                </div>


                <!-- Buttons -->

                <div class="buttons">

                    <button type="submit">
                        Update Transaction
                    </button>

                    <a
                        href="/transactions"
                        class="cancel"
                    >
                        Cancel
                    </a>

                </div>


            </form>


        </div>


    </main>


</body>

</html>
