<!DOCTYPE html>
<html>

<head>

    <title>My Profile - Micro Budgeting</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3fb;
        }

        nav {
            background: #6a1b9a;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 10px 15px;
            border-radius: 6px;
        }

        nav a:hover {
            background: #4a126b;
        }

        .logout {
            background: #d32f2f;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #6a1b9a;
            text-align: center;
        }

        .profile-item {
            padding: 18px;
            margin-top: 15px;
            background: #f7f3fb;
            border-radius: 8px;
        }

        .profile-item strong {
            color: #6a1b9a;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .buttons a {
            display: inline-block;
            background: #6a1b9a;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 7px;
            margin: 5px;
        }

        .buttons a:hover {
            background: #4a126b;
        }

    </style>

</head>

<body>

    <nav>

        <h2>Micro Budgeting</h2>

        <div>

            <a href="/">Dashboard</a>

            <a href="/transactions">Transactions</a>

            <a href="/add">Add Transaction</a>

            <a href="/budget">Budget</a>

            <a href="/logout" class="logout">Logout</a>

        </div>

    </nav>


    <div class="container">

        <div class="profile-card">

            <h1>My Profile</h1>

            <div class="profile-item">

                <strong>Name:</strong>

                {{ user_name }}

            </div>


            <div class="profile-item">

                <strong>Email:</strong>

                {{ user_email }}

            </div>


            <div class="buttons">

                <a href="/">
                    Back to Dashboard
                </a>

                <a href="/logout">
                    Logout
                </a>

            </div>

        </div>

    </div>

</body>

</html>
